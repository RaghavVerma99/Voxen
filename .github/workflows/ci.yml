name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Redis state integration
        run: npm run test:redis
        env:
          REDIS_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379

      - name: Eval regression gate
        run: npm run eval:gate

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: sk-build-placeholder

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e
        env:
          OPENAI_API_KEY: sk-build-placeholder
